name: Build Windows App

# Runs when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`),
# or any time you click "Run workflow" manually in the Actions tab on GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Speeds up repeat builds a lot by caching compiled Rust dependencies
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Windows runners already have the WebView2 runtime preinstalled,
      # so there's no equivalent to the webkit2gtk step Linux needs.
      - name: Build the Windows installer
        run: cargo tauri build

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netroster-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
