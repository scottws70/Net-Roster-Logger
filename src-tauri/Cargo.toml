[package]
name = "N8VCL-Net-Logger"
version = "1.29.1"
description = "Net roster and check-in logger for ham radio net control"
authors = ["N8VCL"]
license = ""
repository = "https://github.com/scottws70/Net-Roster-Logger"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
