[package]
name = "N8VCL-Net-Logger"
version = "1.49.2"
description = "Net roster and check-in logger for ham radio net control"
authors = ["N8VCL"]
license = ""
repository = "https://github.com/scottws70/Net-Roster-Logger"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
# preserve_order keeps the nets (and the fields inside them) in the order the page saved them
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ureq = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tiny_http = "0.12"
if-addrs = "0.15.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }

# In-app updates (desktop only; the Android app updates through its own APK installer)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
